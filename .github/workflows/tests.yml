name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Vitest (incl. contrast regression suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Runs ALL Vitest specs, including the WCAG contrast suite at
      # src/contexts/__tests__/contrast.test.ts. A regression in
      # Pass/Low logic (light/dark surfaces × primary/secondary edge cases)
      # fails this job and blocks merge.
      - name: Run unit tests
        run: npx vitest run --reporter=verbose

      # Belt-and-braces: explicitly fail if the contrast file is missing
      # or stops being picked up by the glob.
      - name: Contrast suite must exist
        run: test -f src/contexts/__tests__/contrast.test.ts
